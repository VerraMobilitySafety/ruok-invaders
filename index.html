<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R U OK? Invaders — Verra Mobility</title>

<style>
:root{
  --verra:#A9C23F;
  --yellow:#FFD33D;
  --yellow2:#FFE267;
  --white:#F7F7F2;
  --black:#050505;
  --soft:#151515;
  --grey:#868686;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:var(--white);font-family:"Courier New",monospace;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 35%,rgba(255,211,61,.08),transparent 34%),
    #050505;
}
.shell{
  width:min(1600px,100vw);
  height:min(980px,100vh);
  margin:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.hud{
  min-height:126px;
  border:2px solid var(--yellow);
  border-radius:24px;
  overflow:hidden;
  display:grid;
  grid-template-columns:1.2fr .7fr .7fr 1fr 1.55fr;
  align-items:stretch;
  background:#050505;
}
.brand,.hudBlock,.ruokBrand{
  display:flex;align-items:center;
}
.brand{padding:18px 28px}
.brand img{max-width:230px;max-height:74px;object-fit:contain}
.hudBlock{padding:14px 28px;border-left:2px solid rgba(255,211,61,.55);flex-direction:column;align-items:flex-start;justify-content:center}
.hudLabel{color:var(--yellow);font-weight:900;font-size:17px;letter-spacing:1px}
.hudValue{font-size:38px;font-weight:900;margin-top:4px}
.hearts{font-size:30px;letter-spacing:5px}
.ruokBrand{
  background:var(--yellow);
  color:#000;
  padding:10px 18px;
  gap:12px;
  justify-content:center;
}
.ruokBrand img.ruokLogo{max-width:250px;max-height:74px;object-fit:contain}
.ruokBrand img.mascotMini{max-height:96px;max-width:230px;object-fit:contain}

.gameframe{
  position:relative;flex:1;min-height:0;
  border:2px solid rgba(255,211,61,.95);
  border-radius:24px;
  overflow:hidden;
  background:#050505;
}
.gameframe::before{
  content:"";
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;
}
canvas{display:block;width:100%;height:100%;background:#050505;image-rendering:pixelated;touch-action:none}

.overlay{
  position:absolute;inset:0;background:rgba(5,5,5,.95);
  display:flex;align-items:center;justify-content:center;z-index:3;
  padding:20px;text-align:center;overflow:auto;
}
.panel{width:min(1040px,95%);margin:auto}
.panel h1{font-size:clamp(42px,6vw,78px);line-height:.95;margin:0 0 14px;color:var(--white);text-shadow:6px 6px 0 #222}
.panel h1 span,.panel h2{color:var(--yellow)}
.panel h2{font-size:32px;margin:0 0 10px}
.panel p{font-size:16px;line-height:1.45}
.btn{
  margin-top:14px;padding:15px 34px;background:var(--yellow);color:#050505;
  border:2px solid var(--yellow);border-radius:10px;
  font:900 20px "Courier New",monospace;cursor:pointer;
  box-shadow:0 0 20px rgba(255,211,61,.18)
}
.btn:hover{background:var(--yellow2)}
.hidden{display:none}

.loginBox{max-width:640px;margin:0 auto}
.loginBox input{
  width:min(520px,92%);padding:15px 16px;margin:10px 0;
  background:#0a0a0a;border:2px solid var(--yellow);border-radius:8px;
  color:var(--white);font:700 17px "Courier New",monospace;outline:none;text-align:center
}
.loginBox input::placeholder{color:#777}
.loginStatus{min-height:24px;margin-top:8px;font-size:14px}

.leaderboard{
  margin:16px auto 12px;
  width:min(650px,96%);
  border:2px solid var(--yellow);
  border-radius:14px;
  padding:12px 18px;
  text-align:left;
  background:rgba(0,0,0,.72)
}
.leaderboardTitle{
  color:var(--yellow);
  font-weight:900;
  text-align:center;
  margin-bottom:10px;
  letter-spacing:1px;
}
.leaderRow{
  display:grid;
  grid-template-columns:48px 1fr 115px 70px;
  gap:10px;
  padding:5px 7px;
  border-bottom:1px solid rgba(255,211,61,.17);
  font-size:14px
}
.leaderRow:last-child{border-bottom:none}
.leaderRank{color:var(--yellow);font-weight:900}
.leaderScore{text-align:right;font-weight:900}
.leaderLevel{text-align:right;color:var(--yellow)}

.gameOverGrid{
  display:grid;
  grid-template-columns:220px 1fr 260px;
  gap:22px;
  align-items:center;
}
.steps{display:flex;flex-direction:column;gap:12px}
.stepCard{
  border:2px solid var(--yellow);border-radius:14px;padding:12px;text-align:left;
  display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;
}
.stepIcon{
  width:48px;height:48px;border-radius:50%;background:var(--yellow);color:#000;
  display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900
}
.stepCard strong{display:block;color:var(--yellow);font-size:18px}
.sideMessage{
  border:2px dashed var(--yellow);border-radius:28px;padding:22px 18px;
  font-size:20px;line-height:1.35
}
.sideMessage strong{color:var(--yellow);font-size:27px}
.mascotPanel img{max-width:100%;max-height:220px;object-fit:contain}
.scoreHero{font-size:72px;font-weight:900;letter-spacing:5px}
.scoreSaved{color:var(--yellow);font-weight:900}

.footer{display:none}

@media(max-width:1100px){
 .hud{grid-template-columns:1fr 1fr 1fr 1fr}
 .ruokBrand{display:none}
 .gameOverGrid{grid-template-columns:1fr}
 .steps,.sideStack{display:none}
 .panel{width:96%}
}

.mobileControls{display:none}
.rotateHint{display:none}

@media (max-width:900px){
  html,body{overflow:hidden;touch-action:none}
  .shell{width:100vw;height:100dvh;padding:4px;gap:4px}
  .hud{min-height:58px;height:58px;border-radius:12px;grid-template-columns:1.15fr .7fr .7fr 1fr}
  .brand{padding:5px 8px}
  .brand img{max-width:115px;max-height:42px}
  .hudBlock{padding:4px 8px}
  .hudLabel{font-size:9px}
  .hudValue{font-size:18px;margin-top:1px}
  .hearts{font-size:13px;letter-spacing:1px}
  .ruokBrand{display:none!important}
  .gameframe{border-radius:12px;padding-bottom:0;flex:1;min-height:0}
  .overlay{padding:8px}
  .panel{width:98%;max-width:none}
  .panel h1{font-size:clamp(28px,8vw,46px);margin-bottom:8px}
  .panel h2{font-size:20px}
  .panel p{font-size:12px;margin:7px 0}
  .loginBox{max-width:96%}
  .loginBox input{padding:11px;font-size:14px}
  .btn{padding:11px 22px;font-size:15px;margin-top:8px}
  .leaderboard{margin:8px auto;padding:8px 10px}
  .leaderRow{grid-template-columns:35px 1fr 78px 45px;font-size:11px;gap:5px;padding:3px 2px}
  .gameOverGrid{display:block}
  .steps,.sideStack{display:none}
  .scoreHero{font-size:42px}
  .mobileControls{
    display:none;grid-template-columns:1fr 1.2fr 1fr;gap:8px;
    position:absolute;left:8px;right:8px;bottom:8px;z-index:5;height:60px
  }
  
  .mobileBtn{
    border:2px solid var(--yellow);border-radius:14px;background:rgba(5,5,5,.92);
    color:var(--yellow);font:900 18px "Courier New",monospace;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:none
  }
  .mobileBtn.fire{background:var(--yellow);color:#050505}
}

@media (max-width:900px) and (orientation:portrait){
  .rotateHint{
    display:flex;position:fixed;inset:0;z-index:9999;background:#050505;color:var(--yellow);
    align-items:center;justify-content:center;text-align:center;padding:30px;
    font:900 24px "Courier New",monospace
  }
}


.gameframe, .gameframe *, canvas, .mobileControls, .mobileBtn{
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas{
  touch-action:none;
}
@media (max-width:900px){
  /* Keep controls low and translucent enough that enemy labels remain visible above them. */
  .mobileControls{
    height:54px;
    gap:6px;
    width:100%;
  }
  .mobileBtn{
    min-height:50px;
    font-size:15px;
    border-radius:11px;
  }
}


@media (max-width:900px){
  .mobileControls{
    position:static !important;
    left:auto !important;
    right:auto !important;
    bottom:auto !important;
    top:auto !important;
    z-index:auto !important;
    width:100% !important;
    height:54px !important;
    flex:0 0 54px !important;
    grid-template-columns:1fr 1.2fr 1fr !important;
    gap:6px !important;
    margin:0 !important;
    padding:0 !important;
  }

  .gameframe{
    flex:1 1 auto !important;
    min-height:0 !important;
    padding-bottom:0 !important;
  }

  .mobileBtn{
    min-height:50px !important;
    height:50px !important;
  }
}


@media (max-width:900px){
  .gameframe{
    position:relative !important;
    padding-bottom:58px !important;
  }
  .gameframe canvas{
    height:100% !important;
  }
  .mobileControls{
    position:absolute !important;
    display:none;
    left:5px !important;
    right:5px !important;
    bottom:4px !important;
    top:auto !important;
    width:auto !important;
    height:50px !important;
    grid-template-columns:1fr 1.2fr 1fr !important;
    gap:6px !important;
    z-index:20 !important;
  }
  .mobileBtn{
    height:50px !important;
    min-height:50px !important;
  }
}

</style>

</head>

async function verifyPlayer(){
 const emailEl=document.getElementById("playerEmail"), statusEl=document.getElementById("loginStatus"), btn=document.getElementById("verifyBtn");
 const email=(emailEl?.value||"").trim().toLowerCase();
 if(!email){statusEl.textContent="ENTER YOUR WORK EMAIL";return;}
 if(VERIFY_FLOW_URL.includes("PASTE_YOUR")){statusEl.textContent="POWER AUTOMATE URL HAS NOT BEEN ADDED YET";return;}
 btn.disabled=true;btn.textContent="CHECKING...";statusEl.textContent="CHECKING EMPLOYEE LOOKUP...";
 try{
  const response=await fetch(VERIFY_FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const result=await response.json();

    if(result.valid === true){
      verifiedPlayerEmail=email;
      playerVerified=true;
      statusEl.textContent="ACCESS GRANTED — PLAYER VERIFIED";
      statusEl.style.color="#a9c23f";
      setTimeout(showReadyScreen,600);
    }else{
      verifiedPlayerEmail="";
      playerVerified=false;
      statusEl.textContent="ACCESS DENIED — EMAIL NOT RECOGNISED";
      statusEl.style.color="#f7f7f2";
      btn.disabled=false;
      btn.textContent="TRY AGAIN";
    }
 }catch(err){console.error(err);statusEl.textContent="COULD NOT VERIFY — "+err.message;btn.disabled=false;btn.textContent="TRY AGAIN";}
}

function buildInvaders(){
  invaders=[];
  const rows=Math.min(3+Math.floor(level/2),5), cols=9;
  const margin=38, gapX=(c.width-(margin*2)-54)/(cols-1), gapY=64;
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
    invaders.push({
      x:margin+col*gapX,y:70+r*gapY,w:54,h:34,
      word:barriers[(r*cols+col+level)%barriers.length],alive:true
    });
  }
  dir=1; speed=22+level*4;
}

function startGame(){
  frame.classList.add("gameRunning");
  score=0;lives=3;level=1;shots=[];enemyShots=[];particles=[];enemyFireTimer=0;resetPlayer();buildInvaders();updateHud();
  running=true;
  overlay.classList.add('hidden');
  setMobileControls(true);
  frame.focus();
  last=performance.now();
  requestAnimationFrame(loop);
}

function nextLevel(){
  running=false;
  const l=lessons[(level-1)%lessons.length];

  overlay.classList.remove('hidden');
  setMobileControls(false);
}

function continueGame(){
  level++;shots=[];enemyShots=[];particles=[];enemyFireTimer=0;resetPlayer();buildInvaders();updateHud();running=true;

async function submitScore(){
  const status=document.getElementById("scoreSubmitStatus");

  if(!verifiedPlayerEmail){
    if(status) status.textContent="SCORE NOT SUBMITTED — PLAYER NOT VERIFIED";
    return;
  }

  if(SUBMIT_SCORE_FLOW_URL.includes("PASTE_YOUR")){
    if(status) status.textContent="SCORE FLOW URL NOT ADDED";
    return;
  }

  try{
    const response=await fetch(SUBMIT_SCORE_FLOW_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email:verifiedPlayerEmail,
        score:score,
        level:level
      })
    });

    let result=null;
    try{result=await response.json();}catch(e){}

    // Accept any successful 2xx response because some Power Automate branches
    // may complete the SharePoint write without returning a JSON body.
    if(response.ok){
      if(status){
        if(result && result.newHighScore===true){
          status.textContent="★ NEW PERSONAL HIGH SCORE SAVED ★";
        }else if(result && result.newHighScore===false){
          status.textContent="SCORE RECEIVED — PERSONAL BEST UNCHANGED";
        }else{
          status.textContent="SCORE SAVED";
        }
      }
    }else if(response.status===403){
      if(status) status.textContent="SCORE REJECTED — PLAYER NOT RECOGNISED";
    }else{
      if(status) status.textContent="SCORE COULD NOT BE SAVED";
      console.error("Score submission failed",response.status,result);
    }
  }catch(err){
    console.error("Score submission error:",err);
    if(status) status.textContent="SCORE COULD NOT BE SAVED";
  }
}

function displayNameFromEmail(email){
  const local=String(email||"PLAYER").split("@")[0];
  const parts=local.split(/[._-]+/).filter(Boolean);

  function cap(s){
    return s ? s.charAt(0).toUpperCase()+s.slice(1).toLowerCase() : "";
  }

  if(parts.length>=2){
    return cap(parts[0])+" "+parts[parts.length-1].charAt(0).toUpperCase()+".";
  }
  return cap(parts[0]||"Player");
}

function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadLeaderboard(){
  const host=document.getElementById("leaderboardHost");
  if(!host) return;

  if(LEADERBOARD_FLOW_URL.includes("PASTE_YOUR")){
    host.innerHTML='<div class="leaderboard"><div class="leaderboardTitle">LEADERBOARD URL NOT ADDED</div></div>';
    return;
  }

  host.innerHTML='<div class="leaderboard"><div class="leaderboardTitle">LOADING TOP 10...</div></div>';

  try{
    const response=await fetch(LEADERBOARD_FLOW_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:"{}"
    });

    if(!response.ok) throw new Error("HTTP "+response.status);

    const rows=await response.json();
    if(!Array.isArray(rows)) throw new Error("Leaderboard response was not an array");

    const top=rows.slice(0,10);
    let body='';

    top.forEach((row,index)=>{
      const name=escapeHtml(displayNameFromEmail(row.email));
      const rowScore=Number(row.score||0).toLocaleString();
      const rowLevel=Number(row.level||0);

      body+=`
        <div class="leaderRow">
          <div class="leaderRank">#${index+1}</div>
          <div>${name}</div>
          <div class="leaderScore">${rowScore}</div>
          <div class="leaderLevel">L${rowLevel}</div>
        </div>`;
    });

    if(!body){
      body='<div style="text-align:center;color:#bbb">NO SCORES YET</div>';
    }

    host.innerHTML=`
      <div class="leaderboard">
        <div class="leaderboardTitle">★ TOP 10 CONVERSATION STARTERS ★</div>
        ${body}
      </div>`;
  }catch(err){
    console.error("Leaderboard error:",err);
    host.innerHTML='<div class="leaderboard"><div class="leaderboardTitle">LEADERBOARD UNAVAILABLE</div></div>';
  }
}

function fire(){
  if(!running||askCooldown>0||!player)return;
  shots.push({x:player.x+player.w/2,y:player.y-8,vy:-360,pulse:true,age:0});
  askCooldown=.28;
}

window.addEventListener('keydown',e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)) return;
  if(e.code==="Space"){
    e.preventDefault();

    // Start/restart from the overlay even if the game frame is not focused.
    if(!overlay.classList.contains('hidden') && !running){
      if(playerVerified && !document.getElementById("playerEmail")) startGame();
      return;
    }

    // Fire while the game is running.
    if(running){
      fire();
    }
  }
});

frame.addEventListener('keydown',e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)) return;
  if(["ArrowLeft","ArrowRight","KeyA","KeyD"].includes(e.code))e.preventDefault();
  keys[e.key.toLowerCase()]=true;
});
frame.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

c.addEventListener('pointerdown',e=>{
  frame.focus();
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width;
  if(x<c.width*.35)keys.touchL=true; else if(x>c.width*.65)keys.touchR=true; else fire();
});
c.addEventListener('pointerup',()=>{keys.touchL=keys.touchR=false});

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,text){particles.push({x,y,text,life:1})}


function fireEnemyShot(){
  const alive=invaders.filter(i=>i.alive);
  if(!alive.length)return;

  // Pick the lowest invader in each rough column, then choose one at random.
  const columns={};
  alive.forEach(i=>{
    const key=Math.round(i.x/95);
    if(!columns[key] || i.y>columns[key].y) columns[key]=i;
  });

  const shooters=Object.values(columns);
  const shooter=shooters[Math.floor(Math.random()*shooters.length)];

  enemyShots.push({
    x:shooter.x+shooter.w/2,
    y:shooter.y+shooter.h+8,
    vy:190+level*28,
    text:enemyWords[Math.floor(Math.random()*enemyWords.length)]
  });
}

function update(dt){
  askCooldown=Math.max(0,askCooldown-dt);

  enemyFireTimer-=dt;
  if(enemyFireTimer<=0){
    fireEnemyShot();
    const base=Math.max(.45,1.55-level*.12);
    enemyFireTimer=base*(.65+Math.random()*.7);
  }
  if(keys["arrowleft"]||keys["a"]||keys.touchL)player.x-=360*dt;
  if(keys["arrowright"]||keys["d"]||keys.touchR)player.x+=360*dt;
  player.x=Math.max(18,Math.min(c.width-player.w-18,player.x));
  shots.forEach(s=>{s.y+=s.vy*dt;s.age=(s.age||0)+dt;});shots=shots.filter(s=>s.y>-60);

  let edge=false;
  invaders.filter(i=>i.alive).forEach(i=>{
    i.x+=dir*speed*dt;
    if(i.x<18||i.x+i.w>c.width-18)edge=true;
  });
  if(edge){dir*=-1;invaders.filter(i=>i.alive).forEach(i=>i.y+=18)}

  shots.forEach(s=>invaders.forEach(i=>{
    if(i.alive&&hit({x:s.x-30,y:s.y-18,w:60,h:36},i)){
      i.alive=false;s.y=-100;score+=100;burst(i.x+i.w/2,i.y,converts[i.word]||"TALKING");updateHud();
    }
  }));

  particles.forEach(p=>{p.life-=dt;p.y-=28*dt});
  particles=particles.filter(p=>p.life>0);

  enemyShots.forEach(s=>s.y+=s.vy*dt);
  enemyShots=enemyShots.filter(s=>s.y<c.height+40);

  for(const s of enemyShots){
    if(hit({x:s.x-22,y:s.y-8,w:44,h:18},player)){
      lives--;
      updateHud();
      burst(player.x+player.w/2,player.y-10,"CONVERSATION LOST");

      if(lives<=0){
        gameOver();
        return;
      }

      enemyShots=[];
      shots=[];
      resetPlayer();
      enemyFireTimer=1.0;
      break;
    }
  }

  const alive=invaders.filter(i=>i.alive);
  if(alive.some(i=>i.y+i.h>player.y-25)){
    lives--;updateHud();
    if(lives<=0){gameOver();return}
    shots=[];enemyShots=[];enemyFireTimer=.8;resetPlayer();buildInvaders();return;
  }
  if(alive.length===0)nextLevel();
}

function drawStars(){
  ctx.fillStyle="#1c2313";
  for(let i=0;i<80;i++){let x=(i*173)%c.width,y=(i*97)%c.height;ctx.fillRect(x,y,(i%7===0?2:1),(i%7===0?2:1));}
}

function drawBrandMarks(){
  ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle=lime;ctx.lineWidth=13;
  const cx=155,cy=300,r=145;
  for(let a=0;a<Math.PI*2;a+=Math.PI/4){
    ctx.save();ctx.translate(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.rotate(a+Math.PI/2);
    ctx.beginPath();ctx.moveTo(-18,-18);ctx.lineTo(0,18);ctx.lineTo(18,-18);ctx.stroke();ctx.restore();
  }
  ctx.restore();
}

function drawAlien(i){
  ctx.fillStyle=i.word==="I'M FINE"?grey:lime;
  const x=i.x,y=i.y;
  ctx.fillRect(x+12,y,30,6);ctx.fillRect(x+6,y+6,42,18);ctx.fillRect(x,y+12,54,12);
  ctx.fillRect(x+6,y+24,10,8);ctx.fillRect(x+38,y+24,10,8);
  ctx.fillStyle="#020302";ctx.fillRect(x+14,y+12,7,7);ctx.fillRect(x+33,y+12,7,7);
  ctx.fillStyle=lime;ctx.font="bold 22px Courier New";ctx.textAlign="center";ctx.fillText(i.word,x+27,y+45);
}

function drawBunkers(){
  ctx.fillStyle=yellow;
  const ys=500;
  [160,390,620,850,1080].forEach((bx,idx)=>{
    for(let r=0;r<4;r++)for(let col=0;col<8;col++){
      if((r>1&&col>2&&col<5)||((idx+col+r)%13===0))continue;
      ctx.fillRect(bx+col*10,ys+r*8,8,6);
    }
  });
}

function drawShip(){
  const x=player.x,y=player.y;
  ctx.save();

  // Verra-green speed camera body
  ctx.fillStyle=lime;
  ctx.fillRect(x+13,y+6,44,34);
  ctx.fillRect(x+18,y+2,34,6);

  // dark casing edge
  ctx.fillStyle="#2e3518";
  ctx.fillRect(x+13,y+36,44,5);

  // lens
  ctx.fillStyle="#050505";
  ctx.fillRect(x+28,y+12,18,18);
  ctx.fillStyle="#f7f7f2";
  ctx.fillRect(x+32,y+15,5,5);
  ctx.fillStyle="#6d7b2c";
  ctx.fillRect(x+37,y+18,6,6);

  // status light
  ctx.fillStyle=yellow;
  ctx.fillRect(x+18,y+11,5,5);

  // stand
  ctx.fillStyle="#d8d8d8";
  ctx.fillRect(x+33,y+41,5,10);
  ctx.fillRect(x+24,y+49,4,10);
  ctx.fillRect(x+43,y+49,4,10);
  ctx.fillRect(x+17,y+57,14,4);
  ctx.fillRect(x+40,y+57,14,4);

  ctx.restore();
}
function draw(){
  ctx.fillStyle="#020302";ctx.fillRect(0,0,c.width,c.height);
  drawStars();drawBunkers();
  invaders.filter(i=>i.alive).forEach(drawAlien);
  drawShip();

  ctx.textAlign="center";ctx.font="bold 15px Courier New";
  shots.forEach(s=>{
    ctx.save();
    ctx.strokeStyle=lime;
    ctx.lineWidth=5;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    // Two separate upward-facing radar arcs.
    // Drawn explicitly with Bezier curves so they cannot intersect.
    ctx.beginPath();
    ctx.moveTo(s.x-12, s.y+18);
    ctx.quadraticCurveTo(s.x, s.y+4, s.x+12, s.y+18);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(s.x-24, s.y+24);
    ctx.quadraticCurveTo(s.x, s.y-2, s.x+24, s.y+24);
    ctx.stroke();

    ctx.restore();
  });

  ctx.font="bold 12px Courier New";
  enemyShots.forEach(s=>{
    ctx.fillStyle="#FF8A3D";
    ctx.fillText(s.text,s.x,s.y);
    ctx.fillRect(s.x-2,s.y+5,4,13);
  });

  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=lime;ctx.font="bold 16px Courier New";ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1});
}

function loop(t){
  if(!running)return;
  const dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();if(running)requestAnimationFrame(loop);
}

resetPlayer();buildInvaders();updateHud();draw();
document.addEventListener("keydown",e=>{const el=document.getElementById("playerEmail");if(e.key==="Enter"&&el&&document.activeElement===el){e.preventDefault();verifyPlayer();}});


function setMobileControls(show){
  const controls=document.getElementById("mobileControls");
  if(!controls) return;
  const mobile=window.matchMedia("(max-width: 900px)").matches;
  controls.style.display=(show && mobile) ? "grid" : "none";
}

function bindHoldButton(id,keyName){
  const el=document.getElementById(id);
  if(!el)return;
  const press=e=>{e.preventDefault();keys[keyName]=true;frame.focus();};
  const release=e=>{e.preventDefault();keys[keyName]=false;};
  el.addEventListener("pointerdown",press);
  el.addEventListener("pointerup",release);
  el.addEventListener("pointercancel",release);
  el.addEventListener("pointerleave",release);
}
setMobileControls(false);
bindHoldButton("btnLeft","touchL");
bindHoldButton("btnRight","touchR");

const fireBtn=document.getElementById("btnFire");
if(fireBtn){
  fireBtn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    frame.focus();
    fire();
  });
}
window.addEventListener("blur",()=>{keys.touchL=false;keys.touchR=false;});


["pointerdown","pointermove","touchstart","touchmove"].forEach(evt=>{
  c.addEventListener(evt,e=>{
    if(window.matchMedia("(max-width: 900px)").matches){
      e.preventDefault();
    }
  },{passive:false});
});

</script>
